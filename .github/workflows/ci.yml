# JTLogin CI.
#
# NOTE: this workflow was written without being able to run it (the authoring environment had no access to Gradle,
# Maven Central or the PaperMC downloads service). Treat the first run as the first real verification and fix
# whatever it reveals. No secrets are used and nothing is published.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build, run unit tests, create the shaded jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :API:build :Plugin:test :Plugin:shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: JTLogin-jar
          path: Plugin/build/libs/JTLogin.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            Plugin/build/reports/tests
            API/build/reports/tests
          if-no-files-found: ignore

  smoke:
    name: Startup smoke test (${{ matrix.platform }} ${{ matrix.version }}${{ matrix.prefix }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend server with JTLogin running standalone. Java: 21 for 1.21.11, 25 for 26.x
          - { platform: paper, version: "1.21.11", java: "21" }
          - { platform: paper, version: "26.1.2",  java: "25" }
          - { platform: paper, version: "26.2",    java: "25" }
          - { platform: paper, version: "26.3",    java: "25" }
          # Proxies. The Velocity 3.x line ends at Minecraft 26.2, 26.3 needs Velocity 4.x (Java 25).
          - { platform: velocity, prefix: "3.", java: "21" }
          - { platform: velocity, prefix: "4.", java: "25" }
          - { platform: bungeecord, java: "21" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JTLogin-jar
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Start the server with JTLogin and check that the plugin loads
        run: |
          set +e
          args=(--platform "${{ matrix.platform }}" --jar dist/JTLogin.jar)
          [ -n "${{ matrix.version }}" ] && args+=(--version "${{ matrix.version }}")
          [ -n "${{ matrix.prefix }}" ] && args+=(--version-prefix "${{ matrix.prefix }}")
          python3 scripts/smoke_test.py "${args[@]}"
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::SKIPPED, no server build available for this entry. It was NOT tested."
            exit 0
          fi
          exit $code
